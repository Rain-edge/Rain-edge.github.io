[params]
  author = 'Rain-edge'
  mainSections = ['posts']
  description = '云计算 · DevOps · SRE · 日常'
  images = ['og-default.png']
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowBreadCrumbs = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowFullTextinRSS = false

[params.homeInfoParams]
  Title = "Rain-edge"
  Subtitle = "云计算 · DevOps · SRE · 日常"

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  keys = ["title", "content"]

# 评论区（Giscus）：默认关闭。在 giscus.app 配置后填入 repo-id 等并设 enabled = true
[params.giscus]
  enabled = false
  repo = "Rain-edge/rain-edge.github.io"
  repoId = ""
  category = "General"
  categoryId = ""
