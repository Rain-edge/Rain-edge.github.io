baseURL = 'https://rain-edge.github.io/'
defaultContentLanguage = 'zh-cn'
title = "Rain-edge 的博客"
theme = 'PaperMod'

[languages.zh-cn]
  languageCode = 'zh-cn'
  languageName = '简体中文'
  weight = 1

enableRobotsTXT = true
hasCJKLanguage = true

# Hugo 0.160 默认 home 输出不含 robots/json，显式声明
# json = 站内搜索索引（Fuse.js）
[outputs]
  home = ['html', 'rss', 'robots', 'json']

# 顶部导航
[menu]
[[menu.main]]
  identifier = 'home'
  name = '主页'
  url = '/'
  weight = 5
[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10
[[menu.main]]
  identifier = 'tech'
  name = '技术'
  url = '/tech/'
  weight = 15
[[menu.main]]
  identifier = 'notes'
  name = '笔记'
  url = '/notes/'
  weight = 16
[[menu.main]]
  identifier = 'life'
  name = '生活'
  url = '/life/'
  weight = 17
[[menu.main]]
  identifier = 'moments'
  name = '瞬间'
  url = '/moments/'
