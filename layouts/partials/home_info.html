{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info">
    <header class="entry-header">
        {{- $title := .Title }}
        <h1 class="home-title">
        {{- range $i, $ch := split $title "" }}
            <span class="tc" style="animation-delay: {{ mul $i 120 }}ms; color: hsl({{ add 185 (mul $i 12) }}, 60%, 40%)">{{ $ch }}</span>
        {{- end }}
        </h1>
        {{- with .Subtitle }}
        <p class="home-subtitle">{{ . | markdownify }}</p>
        {{- end }}
    </header>
    {{- with .Content }}
    <div class="entry-content">{{ . | markdownify }}</div>
    {{- end }}
    <footer class="entry-footer home-links">
        <a href="https://github.com/Rain-edge" class="home-btn" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ "posts/" | absLangURL }}" class="home-btn">全部文章</a>
    </footer>
</article>
{{- end }}
