<!-- Inter 字体（加载失败时自动回退系统字体，不影响使用） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- 页面标题逐字浮现动画（每次页面加载都播放，播放后保持显示） -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.page-header h1, .post-title, .logo a').forEach(function (el) {
        [...el.childNodes].forEach(function (node) {
            if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
                var wrap = document.createElement('span');
                wrap.className = 'tc-wrap';
                var text = node.textContent;
                var total = text.length;
                [...text].forEach(function (ch, i) {
                    var s = document.createElement('span');
                    s.className = 'tc';
                    s.style.animationDelay = (i * 120) + 'ms';
                    // 每个字符唯一色相：均匀分布在整个冷色域（185=青 到 281=紫）
                    var hue = 185 + (i * 96 / Math.max(1, total - 1));
                    s.style.color = 'hsl(' + hue.toFixed(1) + ', 60%, 40%)';
                    s.textContent = ch;
                    wrap.appendChild(s);
                });
                node.replaceWith(wrap);
            }
        });
    });
});
</script>
